spring:
  application:
    name: Spring Sample App
  datasource:
    url: jdbc:h2:tcp://localhost:9092/./target/db
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:initial-data.sql

server:
  port: 9191

logging:
  pattern.console: "[application] %m%n"
  level:
    root: INFO
    org.h2: DEBUG

