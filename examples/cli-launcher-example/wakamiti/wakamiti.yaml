wakamiti:
  resourceTypes:
    - gherkin

  log:
    level: trace
    path: /target/result
    perScenario: true

  launcher:
    modules:
      - mysql:mysql-connector-java:8.0.28

  nonRegisteredStepProviders:
    - steps.CustomSteps

  outputFilePath: /target/result/report.json
  htmlReport:
    output: /target/result/report.html
  rest:
    baseURL: http://host.docker.internal:9966/petclinic/api
  jmeter:
    baseURL: http://host.docker.internal:9966/petclinic/api
    report:
      jtl: /target/result/report.jtl
  database:
    connection:
      url: jdbc:mysql://host.docker.internal:3309/petclinic?useUnicode=true
      username: root
      password: test
      driver: com.mysql.cj.jdbc.Driver
    enableCleanupUponCompletion: "false"
  email:
    store:
      host: host.docker.internal
      port: 3143
      protocol: imap
      folder: INBOX
    address: test@example.com
    password: test
  amqp:
    connection:
      url: amqp://host.docker.internal:5672
      protocol: AMQP_0_9_1
      username: admin
      password: admin
