block.end.blank.line=Blank line at end of block is not allowed.
block.start.blank.line=Blank line at start of block is not allowed.
callable.separator=There must be exactly one blank line between consecutive methods or constructors, ignoring Javadoc and comments.
declaration.parameter.line=Method and constructor parameters must each start on a separate line.
imports.type.blank.lines=There must be exactly two blank lines between the last import and the type declaration, including Javadoc or annotations.
package.imports.blank.lines=There must be exactly two blank lines between the package declaration and imports.
single.space.between.tokens=Use only one space between code tokens.
type.boundary.blank.lines=Every type must have exactly one blank line at the start and end of its body and after its closing brace.
